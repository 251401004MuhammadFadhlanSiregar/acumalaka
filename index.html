<!doctype html> <!-- line 1 : Deklarasi tipe dokumen HTML5 untuk memberitahu browser standar rendering yang digunakan -->
<html lang="id"> <!-- line 2 : Tag pembuka HTML utama dengan atribut bahasa Indonesia (id) untuk SEO dan aksesibilitas -->
  <head> <!-- line 3 : Bagian head untuk metadata, konfigurasi dokumen, link stylesheet, dan judul halaman -->
    <meta charset="UTF-8" /> <!-- line 4 : Menentukan enkripsi karakter UTF-8 agar mendukung berbagai simbol dan karakter teks -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- line 5 : Mengatur viewport responsive agar ukuran halaman menyesuaikan lebar layar perangkat -->
    <meta name="theme-color" content="#f8f7f2" /> <!-- line 6 : Menentukan warna tema browser bar (di mobile) agar senada dengan warna latar website -->
    <meta name="description" content="Kopi Ruang Kita — tempat singgah untuk menikmati kopi, suasana hangat, dan cerita sederhana." /> <!-- line 7 : Ringkasan deskripsi website untuk keperluan optimasi mesin pencari (SEO) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- line 8 : Menghubungkan ikon tab browser (favicon) berformat SVG vektor -->
    <title>Kopi Ruang Kita — Tempat pulang sejenak</title> <!-- line 9 : Judul dokumen yang tampil pada tab browser -->
  </head> <!-- line 10 : Tag penutup bagian head dokumen -->
  <body> <!-- line 11 : Tag pembuka body yang memuat seluruh konten visual yang dilihat pengguna -->
    <div id="root"></div> <!-- line 12 : Elemen kontainer utama (root) tempat aplikasi React di-mount dan dirender secara dinamis -->
    <script type="module" src="/src/main.jsx"></script> <!-- line 13 : Memanggil script entry point aplikasi React (main.jsx) menggunakan standar ES Module -->
  </body> <!-- line 14 : Tag penutup bagian body dokumen -->
</html> <!-- line 15 : Tag penutup dokumen HTML -->
